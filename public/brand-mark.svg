<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Station Agent">
  <defs>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="sGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="blur" in2="SourceGraphic" operator="over"/>
    </filter>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#A855F7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer hexagon ring -->
  <polygon
    points="24,4 42,14 42,34 24,44 6,34 6,14"
    fill="none"
    stroke="url(#sGrad)"
    stroke-width="1.5"
    stroke-linejoin="round"
    opacity="0.9"
  />

  <!-- Inner hexagon -->
  <polygon
    points="24,10 36,17 36,31 24,38 12,31 12,17"
    fill="url(#sGrad)"
    opacity="0.15"
  />

  <!-- Central diamond/rhombus -->
  <polygon
    points="24,14 32,21 24,28 16,21"
    fill="url(#sGradLight)"
    filter="url(#softShadow)"
  />

  <!-- Inner diamond accent -->
  <polygon
    points="24,18 28,21 24,24 20,21"
    fill="url(#sGrad)"
  />

  <!-- Orbital ring 1 -->
  <ellipse
    cx="24" cy="21"
    rx="14"
    ry="6"
    fill="none"
    stroke="url(#sGrad)"
    stroke-width="1"
    stroke-dasharray="2 3"
    opacity="0.4"
    transform="rotate(-20 24 21)"
  />

  <!-- Orbital ring 2 -->
  <ellipse
    cx="24" cy="21"
    rx="10"
    ry="4"
    fill="none"
    stroke="url(#sGradLight)"
    stroke-width="0.75"
    opacity="0.25"
    transform="rotate(30 24 21)"
  />

  <!-- Glow dot -->
  <circle cx="24" cy="21" r="2" fill="url(#sGradLight)" filter="url(#glow)"/>
</svg>
