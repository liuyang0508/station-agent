<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Station Agent">
  <defs>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Platform base -->
  <rect x="6" y="30" width="36" height="4" rx="2" fill="url(#sGrad)" opacity="0.9"/>
  <!-- Left pillar -->
  <rect x="12" y="18" width="4" height="14" rx="2" fill="url(#sGrad)" opacity="0.8"/>
  <!-- Right pillar -->
  <rect x="32" y="18" width="4" height="14" rx="2" fill="url(#sGrad)" opacity="0.8"/>
  <!-- Roof/Canopy -->
  <path d="M8 18 L24 8 L40 18 Z" fill="url(#sGrad)" opacity="0.7"/>
  <!-- Center indicator dot -->
  <circle cx="24" cy="24" r="3" fill="url(#sGrad)" filter="url(#glow)"/>
  <!-- Signal waves -->
  <path d="M18 20 Q24 16 30 20" fill="none" stroke="url(#sGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M15 22 Q24 17 33 22" fill="none" stroke="url(#sGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
</svg>